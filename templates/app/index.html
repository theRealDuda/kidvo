<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Keep this line exactly as it is, first in the head. CI checks it. It stops your game from calling the outside world. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://kidvo.eu data: blob:; script-src 'self' https://kidvo.eu 'unsafe-inline'; style-src 'self' https://kidvo.eu 'unsafe-inline'; img-src 'self' https://kidvo.eu data: blob:; media-src 'self' https://kidvo.eu data: blob:; font-src 'self' https://kidvo.eu data:; connect-src 'self' https://kidvo.eu; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Game</title>
<script src="../../shell/sdk.js"></script>
<script src="../../shell/ask-ai.js"></script>
<script src="lang/en.js"></script>
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-columns: 1fr 260px; font: 16px/1.4 system-ui, sans-serif; background: #f4f5fb; color: #191833; }
  main { display: grid; place-items: center; font-size: 28px; font-weight: 800; }
  /* Explorers (7–9) are still learning to read: bigger, plain letters for everything they read. The desktop sets
     data-band on <html> ("explorers" or "investigators"), so per-band looks are plain CSS. */
  [data-band="explorers"] body { font-size: 18px; }
  [data-band="explorers"] main { font-size: 34px; }
  /* Phones, short landscape screens and fingers: kidvo games must work on all of them. */
  @media (max-width: 560px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr 55%; } }
  @media (max-height: 480px) { main, [data-band="explorers"] main { font-size: 22px; } }
</style>
</head>
<body>
  <main id="question"></main>
  <aside id="ai"></aside>
<script>
  // A tiny practice-AI example: one question, one answer that is wrong on purpose.
  const t = (k, v) => kidvo.t(k, v);
  const aiText = () => ({
    tag: t('ai_tag'), ask: t('ai_ask'), notRight: t('ai_notRight'), caught: t('ai_caught'), fine: t('ai_fine'),
    other: t('ai_other'), sparksLeft: v => t('ai_sparksLeft', v), costs: v => t('ai_costs', v), notEnough: t('ai_notEnough')
  });
  const ai = kidvoAI.create(document.getElementById('ai'), {
    // Your AI's face. Draw your own: one letter per pixel, "." for empty (kidvo.sprite in shell/sdk.js).
    // The pixels of the "led" letter blink while it thinks.
    face: kidvo.sprite(['.KKKKKK.', 'KWWWWWWK', 'KWKWWKWK', 'KWWWWWWK', 'KWRRRRWK', '.KKKKKK.'], { led: 'R' }),
    sparks: 2,
    text: aiText(),
    questions: () => [{
      id: 'answer', label: t('askAi'), cost: 1,
      answer: () => ({
        text: t('answer_wrong'), wrong: true,
        followUps: [{ id: 'sure', label: t('q_sure'), answer: () => ({ text: t('a_sure'), flaggable: false }) }]
      })
    }],
    // The panel already tells the desktop (ai-flagged), and Vo cheers when a wrong answer is caught.
    onFlag: (answer, wasWrong) => { /* reward the player for checking */ }
  });
  // Tell the desktop about the player's moments. Vo, the desktop's pet, cheers on them:
  //   kidvo.emit('caught', {})               a wrong AI answer caught (the panel's "Not right?" already does this)
  //   kidvo.emit('kept', {})                 something private kept
  //   kidvo.emit('judged', { right: true })  a call made; right: true when it was the right one
  //   kidvo.emit('done', {})                 once, when a round is over: this one grows Vo a step
  kidvo.onLang(() => {
    document.getElementById('question').textContent = t('question');
    ai.setText(aiText());
  });
  // Read the question aloud for children who cannot read it yet. kidvo.speak does nothing unless the player switched
  // read-aloud on in the top bar; it takes a line, a list of lines (choices) or an element (a card). The practice-AI
  // panel reads its own answers.
  kidvo.ready(() => kidvo.speak(t('question'), { fresh: true }));

  // Who is playing: kidvo.band is 'explorers' (7–9) or 'investigators' (10–13), chosen once for every game.
  // This game is for Explorers only (manifest "bands"). A game for both bands reads kidvo.band and kidvo.onBand,
  // shows its own "Who is playing?" card only while kidvo.band is null, and passes the child's choice on with
  // kidvo.setBand (Robot Maze shows how). Explorers get fewer words: a shorter text can live under '<key>_explorers',
  // and a picture-first "how to play" card the first time helps (Secret Keeper's begin() shows one).
</script>
</body>
</html>
