name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Read-only on purpose. This workflow runs code from forks, so it gets no secrets
# and no write access. Never switch it to pull_request_target.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  one-pr:
    name: One open PR per person
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Check the author has no other open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) echo "Maintainers are exempt."; exit 0;; esac
          others=$(gh pr list --repo "$REPO" --author "$AUTHOR" --state open --limit 100 --json number \
            --jq "[.[] | select(.number != $NUMBER) | \"#\" + (.number|tostring)] | join(\", \")")
          if [ -n "$others" ]; then
            echo "::error::@$AUTHOR already has an open pull request ($others). kidvo accepts one open PR per GitHub account at a time, so every contributor gets the curator's attention. Close or finish that one first, then reopen this."
            exit 1
          fi
          echo "@$AUTHOR has no other open pull request."

  rule-1:
    name: Do no harm (automatic part)
    # Pinned: ubuntu-latest became Ubuntu 26.04 (2026-11), where Playwright 1.56.0 cannot install its browsers.
    # Go back to ubuntu-latest after moving to a Playwright release that supports it.
    runs-on: ubuntu-24.04
    # The smoke test takes about a minute. Installing the browsers without the cache below has taken 10 to more than
    # 20 minutes (2026-11-23/24), which stopped passing runs at the old 10-minute limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Static checks (manifest, size, no outside links, only own folder)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOW_CORE: ${{ contains(github.event.pull_request.labels.*.name, 'core') }}
        run: node scripts/check.mjs

      - name: Safety rules still catch known tricks
        run: node tests/rules.mjs

      - name: Build the app registry
        run: node scripts/build-registry.mjs

      # The browsers and the Ubuntu packages WebKit needs are cached between runs. On 2026-11-24 the apt mirror sent
      # those packages at about 100 kB/s, and two runs were cancelled at 20 minutes before any test ran. A cached run
      # downloads no browser and no package; apt only reads its package lists. The key changes with package-lock.json
      # (a new Playwright version). A pull request can read main's cache but saves only to its own branch's, so a PR
      # cannot change what main runs with.
      - name: Restore the browsers and their system packages
        id: browsers
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-archives
          key: browsers-ubuntu-24.04-${{ hashFiles('package-lock.json') }}

      - name: Keep apt's downloads where the cache can find them
        run: |
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\nAcquire::Retries "3";\nAcquire::http::Timeout "30";\n' \
            "$HOME/apt-archives" | sudo tee /etc/apt/apt.conf.d/99kidvo-cache

      - name: Install Chromium and WebKit (Safari's engine)
        run: npx playwright install --with-deps chromium webkit

      # Saved right after the install, so a failing smoke test still leaves a warm cache for the next run.
      - name: Save the browsers and their system packages
        if: steps.browsers.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-archives
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: Smoke test (desktop boots, every app opens, no JS errors)
        env:
          SCREENSHOT: screenshot.png
        run: node tests/smoke.mjs

      - name: Keep the screenshot for the reviewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 14
